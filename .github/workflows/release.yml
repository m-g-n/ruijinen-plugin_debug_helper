name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      #プラグインのルートファイルからバージョン番号を取得し、同じバージョンのリリースが既にあればスキップ
      - name: Get Version
        id: get_version
        run: |
          version=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' ruijinen-debug-helper.php | head -n 1 | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error file=ruijinen-debug-helper.php::Version ヘッダーからバージョン番号を取得できませんでした（取得値: '${version}'）"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${version}")" ]; then
            echo "::notice::バージョン ${version} はリリース済みのため、リリース作成をスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      #nodeのセットアップ
      - name: Setup Node.js
        if: steps.get_version.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      #npmでのscriptの実施
      - name: Install Dependencies
        if: steps.get_version.outputs.skip == 'false'
        run: npm ci
      - name: scss build
        if: steps.get_version.outputs.skip == 'false'
        run: npm run build

      #composerの実施（配布用のため開発用パッケージは含めない）
      - name: Composer install
        if: steps.get_version.outputs.skip == 'false'
        uses: docker://composer:2
        with:
          args: install --no-dev --no-interaction --optimize-autoloader

      # release用のzip作成（プラグインの動作に必要なファイルのみ含める）
      - name: Zip Release
        if: steps.get_version.outputs.skip == 'false'
        run: zip -r ruijinen-debug-helper.zip ruijinen-debug-helper.php README.md App dist vendor -x 'App/Debug/error_log'

      # release作成とzipファイルの添付
      - name: Create Release
        if: steps.get_version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          RELEASE_NOTES: ${{ github.event.pull_request.body }}
        run: |
          notes_file="$(mktemp)"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          gh release create "$VERSION" ruijinen-debug-helper.zip \
            --title "$VERSION" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA"

      # mainからdevにPR生成（同期用のPRが既にある場合は作成しない）
      - name: Create a pull request from main to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::mainからdevへのPR #${existing} が既にあるため作成をスキップします"
            exit 0
          fi
          ahead_by=$(gh api "repos/${GITHUB_REPOSITORY}/compare/dev...main" --jq .ahead_by)
          if [ "$ahead_by" = "0" ]; then
            echo "::notice::mainにdevへ反映するコミットがないため作成をスキップします"
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "リリース残処理：mainの内容をdevへ反映" \
            --body "Pulling main into dev"
